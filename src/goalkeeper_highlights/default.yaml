decoder:
  backend: opencv
  threads: 0
  # Increase OpenCV/FFmpeg packet-read tolerance for long MP4 recordings.
  opencv_read_attempts: 65536
  opencv_reopen_retries: 3

yolo:
  model: yolo11s.pt
  tracker: bytetrack.yaml
  image_size: 1280
  confidence: 0.12
  iou: 0.50
  frame_stride: 1
  device: auto

keeper:
  # Version 0.13.10 keeps collecting evidence when a recording starts after a
  # break and the goalkeeper is temporarily far away from the goal.
  automatic_initial_detection: true
  bootstrap_seconds: 15.0
  bootstrap_max_seconds: 240.0
  bootstrap_recheck_seconds: 5.0
  bootstrap_min_observations: 4
  bootstrap_observation_target: 40
  bootstrap_histogram_samples: 20
  bootstrap_min_score: 0.48
  bootstrap_min_confidence: 0.58
  bootstrap_movement_scale: 0.025
  bootstrap_ball_contact_distance: 1.25
  bootstrap_ball_contact_target: 3
  bootstrap_min_margin: 0.035
  bootstrap_top_candidates: 5
  bootstrap_identity_hist_distance: 0.30
  bootstrap_identity_max_gap_seconds: 90.0
  bootstrap_identity_overlap_tolerance_seconds: 0.5
  bootstrap_restart_context_seconds: 45.0
  bootstrap_restart_context_ratio: 0.25
  bootstrap_restart_field_penalty_factor: 0.15
  bootstrap_restart_min_confidence: 0.58
  bootstrap_restart_min_margin: 0.035
  bootstrap_return_to_goal_target: 2
  bootstrap_weights:
    shirt_uniqueness: 0.24
    camera_proximity: 0.08
    goal_area: 0.10
    center_corridor: 0.18
    isolation: 0.10
    depth_stability: 0.10
    horizontal_patrol: 0.07
    low_movement: 0.05
    ball_contact: 0.08
    persistence: 0.10
    return_to_goal: 0.16
    field_excursion_penalty: 0.08
  interactive_selection: true
  goal_roi: [0.15, 0.05, 0.85, 0.95]
  # Two broad depth bands work well for a camera behind one goal: the near goal
  # is normally low in the image and the opposite goal high in the image.
  goal_regions:
    - [0.00, 0.00, 1.00, 0.38]
    - [0.00, 0.62, 1.00, 1.00]
  referee_exclusion_region: [0.15, 0.35, 0.85, 0.65]
  referee_central_penalty: 0.35
  goal_region_falloff: 0.20
  distance_factor: 1.35
  minimum_ball_confidence: 0.15
  minimum_contact_frames: 2
  # Conservative recovery for very fast saves visible in only one sampled frame.
  single_frame_save_min_approach: 0.90
  single_frame_save_min_identity: 0.75
  single_frame_save_min_ball_confidence: 0.45
  confirmation_window_seconds: 0.55
  minimum_identity_confidence: 0.45
  minimum_heuristic_score: 0.35
  reid_min_confidence: 0.62
  reid_position_scale: 4.0
  reid_confirmation_frames: 6
  reid_switch_cooldown_seconds: 1.5
  reid_keep_confidence: 0.50
  reid_switch_margin: 0.12
  reid_reference_weight: 0.25
  reid_continuity_weight: 0.30
  reid_goal_area_weight: 0.25
  reid_shirt_contrast_weight: 0.20
  reid_verbose_console: false
  confidence_lock_after_seconds: 30.0
  # Keeper identity score: shirt contrast 45%, goal area 30%, continuity 15%,
  # similarity to the initially selected shirt 10%.

clips:
  # 0.13 plans clip boundaries from the observed beginning and end of the
  # goalkeeper action. These values are context margins, not fixed windows
  # around the trigger frame.
  seconds_before: 4.0
  seconds_after: 4.0
  category_pre_roll_seconds:
    catch_or_control: 10.0
    cross_claim_or_high_catch: 8.0
    save_or_deflection: 8.0
    diving_save: 9.0
    keeper_clearance: 6.0
    distribution: 4.0
    interaction: 5.0
    recovery_keeper_interaction: 6.0
  category_post_roll_seconds:
    catch_or_control: 11.0
    cross_claim_or_high_catch: 9.0
    save_or_deflection: 10.0
    diving_save: 11.0
    keeper_clearance: 11.0
    distribution: 12.0
    interaction: 8.0
    recovery_keeper_interaction: 7.0
  merge_gap_seconds: 2.0
  dynamic_end_enabled: true
  continuation_gap_seconds: 12.0
  phase_merge_gap_seconds: 30.0
  phase_merge_duration_tolerance: 0.08
  phase_merge_min_pre_roll_seconds: 2.0
  phase_merge_min_post_roll_seconds: 2.0
  final_overlap_merge_enabled: true
  final_overlap_merge_min_ratio: 0.60
  final_overlap_merge_max_gap_seconds: 1.0
  final_overlap_merge_require_same_keeper: true
  final_keeper_contact_tail_seconds: 5.0
  minimum_clip_seconds: 6.0
  max_dynamic_clip_seconds: 45.0
  controlled_release_enabled: true
  controlled_release_search_seconds: 12.0
  controlled_release_safety_tail_seconds: 4.0
  controlled_release_minimum_possession_seconds: 0.5
  controlled_release_minimum_departure_speed: 0.35
  controlled_release_minimum_distance_growth: 0.15
  controlled_release_confirmation_frames: 3
  recovery_distribution_continuation_enabled: true
  recovery_distribution_search_seconds: 12.0
  recovery_distribution_safety_tail_seconds: 4.0
  recovery_distribution_max_gap_seconds: 8.0
  recovery_distribution_allow_rejected_candidate: true
  recovery_continuation_require_ball_dynamics: true
  recovery_continuation_min_interaction_score: 0.30
  recovery_continuation_min_ball_confidence: 0.25
  recovery_continuation_min_possession_seconds: 0.45
  recovery_continuation_min_dynamic_signal: 0.12
  recovery_continuation_min_contact_frames: 2
  recovery_window_tail_fallback_enabled: true
  recovery_window_tail_max_extension_seconds: 8.0
  recovery_window_tail_safety_seconds: 0.0
  recovery_window_tail_require_timeout: true
  recovery_window_tail_source_search_seconds: 20.0
  recovery_window_tail_restart_guard_seconds: 1.2
  catch_control_dynamic_post_roll_enabled: true
  catch_control_idle_tail_low_seconds: 3.0
  catch_control_idle_tail_medium_seconds: 6.0
  catch_control_idle_tail_high_seconds: 7.0
  catch_control_medium_min_contact_frames: 4
  catch_control_medium_min_possession_seconds: 0.25
  catch_control_high_min_contact_frames: 10
  catch_control_high_min_possession_seconds: 1.0
  catch_control_high_min_interaction_score: 0.45
  catch_control_max_post_roll_seconds: 11.0
  # A file change is treated as an edit/half-time boundary unless explicitly
  # enabled. This prevents the last second of one half leaking into the next.
  allow_cross_source_clips: false
  classic_action_rescue:
    enabled: true
    categories: [catch_or_control, cross_claim_or_high_catch, save_or_deflection, diving_save, keeper_clearance, ball_contact, interaction]
    minimum_contact_frames: 2
    maximum_normalized_distance: 0.55
    minimum_identity_confidence: 0.58
    minimum_ball_confidence: 0.25
    minimum_dynamic_signal: 0.12
  interaction_validation:
    enabled: true
    extreme_contact_frames: 80
    suspicious_contact_frames: 12
    minimum_motion_signal: 0.08
    central_field_y_min: 0.36
    central_field_y_max: 0.64
    outside_box_restart_min_seconds: 2.5
  max_candidates: 0
  mode: accurate
  encoder: auto
  parallel_jobs: 2
  preset: fast
  crf: 20
  nvenc_preset: p4
  nvenc_tune: hq
  cq: 20
  audio_bitrate: 160k

qwen:
  enabled: false
  model: Qwen/Qwen2.5-VL-3B-Instruct
  frames_per_candidate: 8
  minimum_confidence: 0.55
  minimum_quality_score: 0.48
  keep_all_candidates: false
  use_4bit: true
  routing:
    enabled: true
    high_threshold: 0.85
    low_threshold: 0.15
    retry_enabled: true
    retry_min_confidence: 0.40
    retry_max_confidence: 0.70
    retry_frames: 12
    retry_context_before: 2.0
    retry_context_after: 2.0
    recovery_force_medium: true
    recovery_retry_min_confidence: 0.30
    short_action_motion_threshold: 0.30
    debug_decisions: false

runtime:
  verbose_console: false
  store_detections: true
  resume: true
  save_debug_frames: false
  export_rejected: true
  progress_interval_seconds: 15

profiling:
  enabled: true
  sample_interval_seconds: 5

event_engine:
  # Distances are normalized by the goalkeeper bounding-box diagonal.
  contact_distance_factor: 1.15
  release_distance_factor: 1.55
  minimum_contact_frames: 2
  # Conservative recovery for very fast saves visible in only one sampled frame.
  single_frame_save_min_approach: 0.90
  single_frame_save_min_identity: 0.75
  single_frame_save_min_ball_confidence: 0.45
  minimum_event_duration_seconds: 0.16
  ball_lost_finalize_seconds: 0.55
  trajectory_lookback_seconds: 1.20
  event_cooldown_seconds: 1.00
  minimum_event_score: 0.34
  category_thresholds:
    catch_or_control: 0.30
    cross_claim_or_high_catch: 0.32
    distribution: 0.22
    keeper_clearance: 0.26
    ball_contact: 0.35
    save_or_deflection: 0.40
    punch_clearance: 0.40
    sweep_or_one_on_one: 0.40
    diving_save: 0.45
    interaction: 0.38
  possession_bonus:
    0.5: 0.02
    1.5: 0.05
    3.0: 0.08
    5.0: 0.12
  approach_speed_target: 0.75
  departure_speed_target: 0.75
  possession_min_seconds: 0.55
  possession_duration_target: 0.80
  keeper_motion_target: 0.75
  high_ball_relative_y: 0.48
  aerial_action_threshold: 0.42
  punch_max_possession_seconds: 0.42
  dive_lateral_motion_target: 0.75
  distribution_departure_threshold: 0.45
  distribution_min_possession_seconds: 0.75
  strong_contact_identity: 0.70
  strong_contact_ball_confidence: 0.40
  strong_contact_frames: 3
  strong_contact_max_distance: 0.35
  strong_contact_bonus: 0.08
  recovery_pass:
    enabled: true
    minimum_ball_confidence: 0.28
    maximum_normalized_distance: 0.85
    minimum_keeper_motion: 0.10
    minimum_ball_motion: 0.35
    minimum_approach_rate: 0.30
    minimum_close_frames: 2
    diagnostic_window_recovery_enabled: true
    diagnostic_min_score: 0.42
    diagnostic_min_ball_confidence: 0.20
    diagnostic_min_keeper_motion: 0.03
    diagnostic_max_distance: 1.45
    diagnostic_group_gap_seconds: 2.5
    single_frame_min_ball_confidence: 0.50
    group_gap_seconds: 1.25
    existing_candidate_mask_seconds: 1.0
    seconds_before: 8.0
    seconds_after: 9.0


# Diagnostic-only analysis for finding missed goalkeeper saves.
# It does not alter acceptance or classification decisions.
diagnostics:
  enabled: true
  window_seconds: 2.0
  candidate_mask_seconds: 1.0
  minimum_ball_confidence: 0.12
  minimum_keeper_motion: 0.035
